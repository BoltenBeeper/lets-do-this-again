<!DOCTYPE html>

  <link rel="icon" type="image/x-icon" href="./images/clock-face-tiny.png">
  
  <link rel="stylesheet" href="./styles/styles.css">

</head>

<body>

  <div id="content">

      </div>

        </div>
      </div>

      <div class="day" id="thursday">
        <div class="hours">
        </div>
      </div>

      <div class="day" id="friday">

        </div>
      </div>

      <div class="day" id="saturday">

        </div>
      </div>

      <div class="day" id="sunday">
        <div class="hours">
        </div>
      </div>

    </div>

  </div>
  
  <script src="./populate-bars.js"></script>

</html>
